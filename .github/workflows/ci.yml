name: quality-gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Test the documented floor and one version above it. 3.11 predates
      # PEP 701 and 3.12 follows it, so this spans the boundary that let
      # v3.0.0 ship two f-strings which only parsed on 3.12+.
      #
      # 3.10 is deliberately absent: 25 corpus rows carry raw NUL bytes
      # (null-byte evasion), and 3.10's csv module rejects NUL on both read
      # and write. 3.11 lifted that. See DATASHEET.md > Limitations.
      matrix:
        python-version: ["3.11", "3.12"]
    name: gate (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements.txt

      # Must precede the rebuild: `src.build` rewrites SHA256SUMS, which would
      # paper over a commit whose files and manifest disagree.
      - name: Released files match SHA256SUMS
        run: python -m src.checksums --check

      - name: Rebuild corpus (offline, deterministic)
        run: python -m src.build --no-parquet

      - name: Fail if the committed CSV is not reproducible
        run: |
          git diff --exit-code -- data/webinject2026.csv \
            || (echo "::error::committed CSV differs from a clean rebuild" && exit 1)

      - name: Quality gate
        run: python -m src.validate

      # Promoted from advisory to blocking in v4.0.0: all four construction
      # checks pass, so a regression in any of them now fails the build.
      - name: Construction checks (register, splits, sessions, pairs, transfer)
        run: python -m src.audit_gaps

      - name: Single-character shortcut statistics
        run: python -m src.shortcut_stats

      - name: Tests
        run: pytest -q

      - name: Reference baselines
        run: python -m src.baselines --fast

      - name: Evaluation protocols
        run: python -m src.evaluate --protocol disjoint
